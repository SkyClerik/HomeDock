<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Home DOCK v2</title>
  <link rel="icon" type="image/png" href="resources/home_image.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <!-- Подключаем тему стили настроек -->
  <link id="theme-link" rel="stylesheet" href="styles-gx.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="yt-helper.css">
</head>

<body>
  <div class="app-shell">
    <!-- 1. ВЕРХНЯЯ ШАПКА (высота 100px) -->
    <header>
      <div class="brand">
          <div class="brand-title">
            <div class="brand-dot"></div>
            <span><span id="app-brand-name">Home Dock</span> <small class="brand-version" id="app-brand-version">v2.0</small></span>
          </div>
          <div class="brand-subtitle" id="app-brand-subtitle">
            Мое личное стартовое окно для ссылок и софта.
          </div>
      </div>

      <div class="header-controls">
        <div class="pill">
          <span class="pill-dot"></span>
          <span id="link-count">0 элементов</span>
        </div>

        <div class="search-box">
          <input id="search-input" type="text" placeholder="Поиск: имя, тег, url…">
          <div class="search-kbd">Ctrl + K</div>
        </div>

        <div class="srv-controls">
          <button class="srv-btn" id="btn-open-yt" title="YouTube Video Info">📺</button>
          <button class="srv-btn" id="btn-open-tabSettings" title="Вкладки">📑</button>
          <button class="srv-btn" id="btn-open-settings" title="Настройки">⚙️</button>
          <button class="srv-btn" onclick="controlServer('restart')" title="Перезапустить сервер">🔄</button>
          <button class="srv-btn danger" onclick="controlServer('shutdown')" title="Выключить сервер">🛑</button>
        </div>
      </div>
    </header>

    <!-- 2. РАБОЧАЯ ОБЛАСТЬ: СЛЕВА ВКЛАДКИ (200px) / СПРАВА ОТОБРАЖЕНИЕ -->
    <div class="workspace">
      <aside class="sidebar" id="sidebar-nav">
        <!-- Кнопки вкладок из папки tabs/ генерируются сюда автоматически -->
      </aside>

      <main class="tab-viewport" id="tab-content">
        <!-- Содержимое выбранной вкладки подгружается сюда -->
      </main>
    </div>

    <!-- 3. НИЖНИЙ ПОДВАЛ -->
    <footer>
      <div>По всем вопросам просьба не обращаться к разработчику.</div>
      <div class="footer-right">
        <div class="status-dot"></div>
        <div id="status-text">Готово к работе</div>
      </div>
    </footer>
  </div>

  <script src="marked.umd.js"></script>
  <script src="app.js"></script>
  <script src="settings.js"></script>
  <script src="tab-manager.js"></script>
  <script src="tutorial.js"></script>
  <script src="yt-helper.js"></script>
</body>

</html>
